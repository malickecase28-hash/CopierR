listen = "127.0.0.1:48100"
journal_path = "var/copier.journal.jsonl"
durability = "flush"
queue_capacity = 2048

# cTrader Open API application credentials. Register the application with
# cTrader/Spotware, complete OAuth for each account, and put the resulting
# secrets/tokens in environment variables rather than this file.
[ctrader]
client_id_env = "CTRADER_CLIENT_ID"
client_secret_env = "CTRADER_CLIENT_SECRET"
# live_url = "wss://live.ctraderapi.com:5036"
# demo_url = "wss://demo.ctraderapi.com:5036"

# MetaApi is the initial terminal-free MT4/MT5 provider. CopierR can attach to
# an existing MetaApi account ID or provision cloud access from broker login,
# server and a password stored in an environment variable.
[metaapi]
auth_token_env = "METAAPI_AUTH_TOKEN"
# provisioning_base = "https://mt-provisioning-api-v1.agiliumtrade.agiliumtrade.ai"

# TrinityR/native producers still use the local low-latency agent protocol.
[[accounts]]
id = "trinity-master"
platform = "trinity"
role = "master"
backend = "agent"
token = "replace-trinity-token"
allow_rebroadcast = false

# Terminal-free MT5 follower using an already provisioned MetaApi account.
[[accounts]]
id = "mt5-follower-1"
platform = "mt5"
role = "follower"
backend = "meta_api"
allow_rebroadcast = false

[accounts.metaapi]
account_id = "replace-metaapi-account-id"
region = "new-york"
poll_interval_ms = 100
magic = 8104811

# Terminal-free MT4 follower with automatic MetaApi provisioning. Do not put
# the trading password in this file; export MT4_FOLLOWER_PASSWORD instead.
[[accounts]]
id = "mt4-follower-1"
platform = "mt4"
role = "follower"
backend = "meta_api"
allow_rebroadcast = false

[accounts.metaapi]
login = "12345678"
server = "Broker-MT4-Live"
password_env = "MT4_FOLLOWER_PASSWORD"
region = "new-york"
poll_interval_ms = 100
magic = 8104812

# Native cTrader Open API follower. No cTrader desktop or cBot is required.
[[accounts]]
id = "ctrader-follower-1"
platform = "ctrader"
role = "follower"
backend = "c_trader_open_api"
allow_rebroadcast = false

[accounts.ctrader]
ctid_trader_account_id = 12345678
access_token_env = "CTRADER_FOLLOWER_ACCESS_TOKEN"
environment = "live"

# Direct venue accounts can also be masters or role="both". CopierR will emit
# normalized position events from their remote state and suppress feedback for
# positions opened by CopierR itself.

[[routes]]
id = "trinity-to-mt5"
source_account_id = "trinity-master"
target_account_id = "mt5-follower-1"
enabled = true
sizing = "multiplier"
size_value = 1.0
reverse = false
copy_sl_tp = true
min_volume = 0.01
max_volume = 20.0
volume_step = 0.01
max_event_age_ms = 5000
symbol_suffix = ""
allow_symbols = ["XAUUSD", "EURUSD"]

[routes.symbol_map]
XAUUSD = "XAUUSD"
EURUSD = "EURUSD"

[[routes]]
id = "trinity-to-ctrader"
source_account_id = "trinity-master"
target_account_id = "ctrader-follower-1"
enabled = true
sizing = "mirror"
size_value = 1.0
reverse = false
copy_sl_tp = true
min_volume = 0.01
max_volume = 20.0
volume_step = 0.01
max_event_age_ms = 5000
