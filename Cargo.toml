[workspace]
resolver = "2"
members = [
    "crates/copier-core",
    "crates/copier-daemon",
    "crates/copier-client",
    "crates/copier-bridge-ffi",
]
default-members = [
    "crates/copier-core",
    "crates/copier-daemon",
    "crates/copier-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["CopierR"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/malickecase28-hash/CopierR"
description = "Low-latency multi-account trade-copying daemon for TrinityR"

[workspace.dependencies]
anyhow = "1"
clap = { version = "=4.5.23", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs", "process"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
